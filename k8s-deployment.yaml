apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/tracking-id: v9e-bookport:apps/Deployment:bookport/bookport
  labels:
    app: bookport
  name: bookport
  namespace: bookport
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookport
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: bookport
    spec:
      # Зафиксировано явно, совпадает со значением по умолчанию Kubernetes.
      terminationGracePeriodSeconds: 30
      containers:
      - env:
        - name: NODE_ENV
          value: production
        - name: DASHSCOPE_BASE_URL
          value: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
        - name: RINGO_PROXY_URL
          value: http://ai-egress-proxy.egress-proxy.svc.cluster.local:3128
        - name: SERVER_URL
          value: https://app.vsedelovede.ru
        - name: PORT
          value: "3000"
        envFrom:
        - secretRef:
            name: bookport-db
        image: docker.io/vsedelovede/bookport:latest
        imagePullPolicy: Always
        name: bookport
        ports:
        - containerPort: 3000
          name: http
        resources:
          limits:
            cpu: 300m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        # entrypoint перед `exec "$@"` гоняет migrate deploy и (при пустой Книге) сид, поэтому
        # port открывается не сразу — сначала startupProbe, остальные ждут её.
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
