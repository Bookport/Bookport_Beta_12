services:
  db:
    image: postgres:16-alpine
    container_name: bookport_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookport
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: bookport_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookport -d bookport_db"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  app:
    build: .
    container_name: bookport_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://bookport:${DB_PASSWORD}@db:5432/bookport_db
      NODE_ENV: production
      ALLOW_TEST_AUTH: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src/anna_wiki:/app/src/anna_wiki:ro

volumes:
  pgdata:
